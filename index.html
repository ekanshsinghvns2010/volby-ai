<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Volby AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🤖 Volby AI</h1>
        <p>Your AI assistant</p>
    </header>

    <main id="chat">

        <div class="message ai">
            Hello! I'm Volby. How can I help you today?
        </div>

    </main>

    <div id="input-area">

        <div id="input-box">

            <input
                type="text"
                id="user-input"
                placeholder="Message Volby..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
