<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1020"
    >

    <title>Volby AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

</head>


<body data-theme="blue">


    <!-- =====================================================
         APP
    ====================================================== -->

    <div id="app">


        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-top">

                <div class="brand">

                    <div class="brand-logo">
                        V
                    </div>

                    <div class="brand-name">
                        Volby AI
                    </div>

                </div>


                <button
                    id="close-sidebar"
                    class="icon-button"
                    type="button"
                    aria-label="Close sidebar"
                >
                    ×
                </button>

            </div>


            <button
                id="new-chat"
                class="new-chat-button"
                type="button"
            >

                <span>＋</span>

                <span>New chat</span>

            </button>


            <div class="history-section">

                <div class="section-title">
                    Recent chats
                </div>

                <div
                    id="history-list"
                    class="history-list"
                ></div>

                <div
                    id="empty-history"
                    class="empty-history"
                >
                    Your conversations will appear here.
                </div>

            </div>


            <div class="sidebar-bottom">

                <button
                    id="about-button"
                    class="sidebar-button"
                    type="button"
                >

                    <span>ⓘ</span>

                    <span>About Volby</span>

                </button>

            </div>

        </aside>


        <!-- SIDEBAR OVERLAY -->

        <div
            id="sidebar-overlay"
            class="sidebar-overlay"
        ></div>


        <!-- =================================================
             MAIN
        ================================================== -->

        <main id="main">


            <!-- TOP BAR -->

            <header class="topbar">

                <button
                    id="menu-button"
                    class="icon-button"
                    type="button"
                    aria-label="Open sidebar"
                >
                    ☰
                </button>


                <div class="topbar-title">

                    <strong>Volby</strong>

                    <span>AI Assistant</span>

                </div>


                <button
                    id="top-new-chat"
                    class="top-new-chat"
                    type="button"
                    aria-label="New chat"
                >
                    ＋
                </button>

            </header>


            <!-- =================================================
                 CHAT
            ================================================== -->

            <section
                id="chat"
                class="chat"
            >

                <!-- Welcome -->

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-logo">
                        V
                    </div>

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        Ask Volby anything.
                    </p>


                    <div
                        id="suggestions"
                        class="suggestions"
                    >

                        <button
                            class="suggestion"
                            data-prompt="Explain something interesting to me"
                            type="button"
                        >
                            <span>💡</span>
                            <span>Teach me something</span>
                        </button>

                        <button
                            class="suggestion"
                            data-prompt="Help me write something creative"
                            type="button"
                        >
                            <span>✍️</span>
                            <span>Help me write</span>
                        </button>

                    </div>

                </div>


                <!-- Messages -->

                <div
                    id="messages"
                    class="messages"
                ></div>

            </section>


            <!-- =================================================
                 COMPOSER
            ================================================== -->

            <footer class="composer-area">

                <div class="composer">


                    <textarea
                        id="user-input"
                        rows="1"
                        maxlength="10000"
                        placeholder="Message Volby..."
                        autocomplete="off"
                    ></textarea>


                    <button
                        id="send-button"
                        class="send-button"
                        type="button"
                        aria-label="Send message"
                        disabled
                    >
                        ↑
                    </button>

                </div>


                <div
                    id="input-controls"
                    class="input-controls"
                >

                    <!-- JS inserts model selector here -->

                    <div class="input-hint">
                        Volby can make mistakes. Check important information.
                    </div>

                    <div
                        id="character-count"
                        class="character-count"
                    >
                        0 / 10,000
                    </div>

                </div>

            </footer>

        </main>

    </div>
