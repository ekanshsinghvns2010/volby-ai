<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volby AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #171717;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            color: #999;
            margin-top: 5px;
            font-size: 14px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            margin: auto;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ai {
            background: #242424;
            margin-right: auto;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
        }

        #input-area {
            padding: 15px;
            background: #171717;
            border-top: 1px solid #333;
        }

        #input-box {
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: auto;
        }

        #user-input {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #send-button {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #send-button:hover {
            background: #1d4ed8;
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }

            #user-input {
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🤖 Volby AI</h1>
        <p>Your AI assistant</p>
    </header>

    <main id="chat">

        <div class="message ai">
            Hello! I'm Volby. How can I help you today?
        </div>

    </main>

    <div id="input-area">

        <div id="input-box">

            <input
                type="text"
                id="user-input"
                placeholder="Message Volby..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>

    <script>

        // Your Render backend
        const BACKEND_URL =
            "https://volby-ai-backend.onrender.com/chat";


        // Get HTML elements
        const input =
            document.getElementById("user-input");

        const sendButton =
            document.getElementById("send-button");

        const chat =
            document.getElementById("chat");


        // Send message function
        async function sendMessage() {

            const text = input.value.trim();

            // Don't send empty messages
            if (text === "") {
                return;
            }


            // Show user's message
            const userMessage =
                document.createElement("div");

            userMessage.className =
                "message user";

            userMessage.textContent =
                text;

            chat.appendChild(userMessage);


            // Clear input
            input.value = "";


            // Disable button while waiting
            sendButton.disabled = true;


            // Show thinking message
            const aiMessage =
                document.createElement("div");

            aiMessage.className =
                "message ai";

            aiMessage.textContent =
                "Volby is thinking...";

            chat.appendChild(aiMessage);


            // Scroll to bottom
            chat.scrollTop =
                chat.scrollHeight;


            try {

                // Send message to Render backend
                const response =
                    await fetch(BACKEND_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })

                    });


                // Check for server error
                if (!response.ok) {
                    throw new Error(
                        "Server error: " +
                        response.status
                    );
                }


                // Get AI response
                const data =
                    await response.json();


                // Display Volby's response
                aiMessage.textContent =
                    data.response;


            } catch (error) {

                console.error(
                    "Volby Error:",
                    error
                );


                // Show error
                aiMessage.textContent =
                    "Sorry, I couldn't connect to Volby right now. Please try again.";

            }


            // Enable button again
            sendButton.disabled = false;


            // Scroll to bottom
            chat.scrollTop =
                chat.scrollHeight;

        }


        // Send when button is clicked
        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // Send when Enter is pressed
        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>
</html>
